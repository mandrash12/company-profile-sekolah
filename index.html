<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Sistem Informasi Profil Sekolah</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-logo">
            <i class="fas fa-school"></i>
        </div>
        <h2>Admin Panel</h2>
        <p class="text-muted mb-3">Sistem Informasi Profil Sekolah</p>
        
        <form id="loginForm">
            <div class="form-group text-left" style="text-align: left;">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Masukkan username" required>
            </div>
            
            <div class="form-group text-left" style="text-align: left;">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
                    <i class="fas fa-eye toggle-password" id="toggleIcon" onclick="togglePasswordVisibility()"></i>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">Login</button>
            
            <p id="login-error" class="error-text"></p>
            <p class="text-muted mt-3" style="font-size: 0.8rem;">Gunakan <b>admin</b> / <b>admin123</b> untuk login simulasi.</p>
        </form>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
