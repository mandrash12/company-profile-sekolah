<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Berita - Admin Panel</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="admin-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-school"></i> Admin Panel</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html" class="menu-item"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="profil-sekolah.html" class="menu-item"><i class="fas fa-building"></i> Profil Sekolah</a></li>
                <li><a href="data-guru.html" class="menu-item"><i class="fas fa-chalkboard-teacher"></i> Data Guru</a></li>
                <li><a href="data-siswa.html" class="menu-item"><i class="fas fa-user-graduate"></i> Data Siswa</a></li>
                <li><a href="berita.html" class="menu-item active"><i class="fas fa-newspaper"></i> Berita</a></li>
                <li><a href="galeri.html" class="menu-item"><i class="fas fa-images"></i> Galeri</a></li>
                <li><a href="pengumuman.html" class="menu-item"><i class="fas fa-bullhorn"></i> Pengumuman</a></li>
                <li><a href="prestasi.html" class="menu-item"><i class="fas fa-trophy"></i> Prestasi</a></li>
                <li><a href="laporan.html" class="menu-item"><i class="fas fa-file-alt"></i> Laporan</a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="btn btn-danger" id="logoutBtn" style="width: 100%; justify-content: center;"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button class="toggle-btn" id="toggleSidebarBtn"><i class="fas fa-bars"></i></button>
                <div class="topbar-right">
                    <div class="admin-profile">
                        <span>Admin Sekolah</span>
                        <img src="https://via.placeholder.com/35" alt="Profile">
                    </div>
                </div>
            </header>

            <div class="page-content">
                <h2 class="mb-3">Daftar Berita</h2>
                
                <div class="card">
                    <div class="table-controls">
                        <a href="form-berita.html" class="btn btn-primary"><i class="fas fa-plus"></i> Tambah Berita</a>
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchBerita" placeholder="Cari Judul Berita...">
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Judul</th>
                                    <th>Kategori</th>
                                    <th>Penulis</th>
                                    <th>Tanggal</th>
                                    <th>Status</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tableBeritaBody">
                                <!-- Data diisi oleh script.js -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Delete -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal" style="max-width: 400px; text-align: center;">
            <div class="modal-body" style="padding-top: 2rem;">
                <i class="fas fa-exclamation-circle text-warning" style="font-size: 4rem; margin-bottom: 1rem;"></i>
                <h3>Hapus Berita?</h3>
                <p class="text-muted">Apakah Anda yakin ingin menghapus berita ini?</p>
            </div>
            <div class="modal-footer" style="justify-content: center;">
                <button type="button" class="btn btn-outline close-modal">Batal</button>
                <button type="button" class="btn btn-danger" onclick="processDelete()">Ya, Hapus</button>
            </div>
        </div>
    </div>

    <script src="../assets/js/script.js"></script>
</body>
</html>
