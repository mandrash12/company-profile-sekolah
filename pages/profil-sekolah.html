<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Sekolah - Admin Panel</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-school"></i> Admin Panel</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html" class="menu-item"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="profil-sekolah.html" class="menu-item"><i class="fas fa-building"></i> Profil Sekolah</a></li>
                <li><a href="data-guru.html" class="menu-item"><i class="fas fa-chalkboard-teacher"></i> Data Guru</a></li>
                <li><a href="data-siswa.html" class="menu-item"><i class="fas fa-user-graduate"></i> Data Siswa</a></li>
                <li><a href="berita.html" class="menu-item"><i class="fas fa-newspaper"></i> Berita</a></li>
                <li><a href="galeri.html" class="menu-item"><i class="fas fa-images"></i> Galeri</a></li>
                <li><a href="pengumuman.html" class="menu-item"><i class="fas fa-bullhorn"></i> Pengumuman</a></li>
                <li><a href="prestasi.html" class="menu-item"><i class="fas fa-trophy"></i> Prestasi</a></li>
                <li><a href="laporan.html" class="menu-item"><i class="fas fa-file-alt"></i> Laporan</a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="btn btn-danger" id="logoutBtn" style="width: 100%; justify-content: center;"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <button class="toggle-btn" id="toggleSidebarBtn"><i class="fas fa-bars"></i></button>
                <div class="topbar-right">
                    <div class="admin-profile">
                        <span>Admin Sekolah</span>
                        <img src="https://via.placeholder.com/35" alt="Profile">
                    </div>
                </div>
            </header>

            <div class="page-content">
                <h2 class="mb-3">Pengaturan Profil Sekolah</h2>
                
                <div class="card">
                    <form id="formProfilSekolah">
                        <div class="stats-grid" style="grid-template-columns: 1fr 1fr;">
                            <div class="form-group">
                                <label for="namaSekolah">Nama Sekolah</label>
                                <input type="text" id="namaSekolah" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="npsn">NPSN</label>
                                <input type="text" id="npsn" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="telepon">Nomor Telepon</label>
                                <input type="text" id="telepon" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="website">Website</label>
                                <input type="text" id="website" class="form-control">
                            </div>
                            <div class="form-group">
                                <label for="kepsek">Kepala Sekolah</label>
                                <input type="text" id="kepsek" class="form-control">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="alamat">Alamat Lengkap</label>
                            <textarea id="alamat" class="form-control" rows="3"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="deskripsi">Deskripsi Sekolah</label>
                            <textarea id="deskripsi" class="form-control" rows="4"></textarea>
                        </div>
                        
                        <div class="stats-grid" style="grid-template-columns: 1fr 1fr;">
                            <div class="form-group">
                                <label for="visi">Visi</label>
                                <textarea id="visi" class="form-control" rows="4"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="misi">Misi</label>
                                <textarea id="misi" class="form-control" rows="4"></textarea>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Logo Sekolah</label>
                            <input type="file" class="form-control" accept="image/*">
                        </div>

                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Simpan Perubahan</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/script.js"></script>
</body>
</html>
