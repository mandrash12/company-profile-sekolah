<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Berita - Admin Panel</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="admin-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-school"></i> Admin Panel</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html" class="menu-item"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="profil-sekolah.html" class="menu-item"><i class="fas fa-building"></i> Profil Sekolah</a></li>
                <li><a href="data-guru.html" class="menu-item"><i class="fas fa-chalkboard-teacher"></i> Data Guru</a></li>
                <li><a href="data-siswa.html" class="menu-item"><i class="fas fa-user-graduate"></i> Data Siswa</a></li>
                <li><a href="berita.html" class="menu-item active"><i class="fas fa-newspaper"></i> Berita</a></li>
                <li><a href="galeri.html" class="menu-item"><i class="fas fa-images"></i> Galeri</a></li>
                <li><a href="pengumuman.html" class="menu-item"><i class="fas fa-bullhorn"></i> Pengumuman</a></li>
                <li><a href="prestasi.html" class="menu-item"><i class="fas fa-trophy"></i> Prestasi</a></li>
                <li><a href="laporan.html" class="menu-item"><i class="fas fa-file-alt"></i> Laporan</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button class="toggle-btn" id="toggleSidebarBtn"><i class="fas fa-bars"></i></button>
                <div class="topbar-right">
                    <div class="admin-profile">
                        <span>Admin Sekolah</span>
                        <img src="https://via.placeholder.com/35" alt="Profile">
                    </div>
                </div>
            </header>

            <div class="page-content">
                <div class="mb-3" style="display: flex; justify-content: space-between; align-items: center;">
                    <h2>Tambah / Edit Berita</h2>
                    <a href="berita.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Kembali</a>
                </div>
                
                <div class="card">
                    <form onsubmit="event.preventDefault(); alert('Berita berhasil disimpan! (Simulasi)'); window.location.href='berita.html';">
                        <div class="form-group">
                            <label>Judul Berita</label>
                            <input type="text" class="form-control" required>
                        </div>
                        
                        <div class="stats-grid" style="grid-template-columns: 1fr 1fr 1fr;">
                            <div class="form-group">
                                <label>Kategori</label>
                                <select class="form-control" required>
                                    <option value="Akademik">Akademik</option>
                                    <option value="Prestasi">Prestasi</option>
                                    <option value="Pengumuman">Pengumuman</option>
                                    <option value="Event">Event</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Penulis</label>
                                <input type="text" class="form-control" value="Admin" readonly>
                            </div>
                            <div class="form-group">
                                <label>Tanggal</label>
                                <input type="date" class="form-control" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Gambar Headline</label>
                            <input type="file" class="form-control" accept="image/*">
                        </div>
                        
                        <div class="form-group">
                            <label>Isi Berita</label>
                            <textarea class="form-control" rows="10" required></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>Status</label>
                            <select class="form-control" required>
                                <option value="Published">Published</option>
                                <option value="Draft">Draft</option>
                            </select>
                        </div>

                        <div class="form-group mt-3">
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Simpan Berita</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/script.js"></script>
</body>
</html>
