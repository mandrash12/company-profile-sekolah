<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Admin Panel</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-school"></i> Admin Panel</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html" class="menu-item active"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="profil-sekolah.html" class="menu-item"><i class="fas fa-building"></i> Profil Sekolah</a></li>
                <li><a href="data-guru.html" class="menu-item"><i class="fas fa-chalkboard-teacher"></i> Data Guru</a></li>
                <li><a href="data-siswa.html" class="menu-item"><i class="fas fa-user-graduate"></i> Data Siswa</a></li>
                <li><a href="berita.html" class="menu-item"><i class="fas fa-newspaper"></i> Berita</a></li>
                <li><a href="galeri.html" class="menu-item"><i class="fas fa-images"></i> Galeri</a></li>
                <li><a href="pengumuman.html" class="menu-item"><i class="fas fa-bullhorn"></i> Pengumuman</a></li>
                <li><a href="prestasi.html" class="menu-item"><i class="fas fa-trophy"></i> Prestasi</a></li>
                <li><a href="laporan.html" class="menu-item"><i class="fas fa-file-alt"></i> Laporan</a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="btn btn-danger" id="logoutBtn" style="width: 100%; justify-content: center;"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <button class="toggle-btn" id="toggleSidebarBtn"><i class="fas fa-bars"></i></button>
                <div class="topbar-right">
                    <div class="admin-profile">
                        <span>Admin Sekolah</span>
                        <img src="https://via.placeholder.com/35" alt="Profile">
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="page-content" id="dashboard-page">
                <h2 class="mb-3">Dashboard Overview</h2>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-chalkboard-teacher"></i></div>
                        <div class="stat-info">
                            <h4>Total Guru</h4>
                            <p id="totalGuru">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-user-graduate"></i></div>
                        <div class="stat-info">
                            <h4>Total Siswa</h4>
                            <p id="totalSiswa">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-newspaper"></i></div>
                        <div class="stat-info">
                            <h4>Total Berita</h4>
                            <p id="totalBerita">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-trophy"></i></div>
                        <div class="stat-info">
                            <h4>Total Prestasi</h4>
                            <p id="totalPrestasi">0</p>
                        </div>
                    </div>
                </div>

                <div class="stats-grid" style="grid-template-columns: 2fr 1fr;">
                    <div class="card">
                        <div class="card-header">
                            <h3>Statistik Siswa</h3>
                        </div>
                        <canvas id="dashboardChart"></canvas>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h3>Berita Terbaru</h3>
                        </div>
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Judul</th>
                                        <th>Kategori</th>
                                        <th>Tanggal</th>
                                    </tr>
                                </thead>
                                <tbody id="recentNewsTable">
                                    <!-- Diisi oleh JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
            </div>
        </main>
    </div>

    <script src="../assets/js/script.js"></script>
</body>
</html>
